name: build pinned module

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch containing the commit'
        required: true
        default: 'master'
        type: string
      commit:
        description: 'Commit SHA to build (empty = latest commit on selected branch)'
        required: false
        default: ''
        type: string
      build_all:
        description: 'Build all KMIs'
        required: false
        default: false
        type: boolean
      kmi_android12_5_10:
        description: 'android12-5.10'
        required: false
        default: false
        type: boolean
      kmi_android13_5_10:
        description: 'android13-5.10'
        required: false
        default: false
        type: boolean
      kmi_android13_5_15:
        description: 'android13-5.15'
        required: false
        default: false
        type: boolean
      kmi_android14_5_15:
        description: 'android14-5.15'
        required: false
        default: false
        type: boolean
      kmi_android14_6_1:
        description: 'android14-6.1'
        required: false
        default: true
        type: boolean
      kmi_android15_6_6:
        description: 'android15-6.6'
        required: false
        default: false
        type: boolean
      kmi_android16_6_12:
        description: 'android16-6.12'
        required: false
        default: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.event.inputs.branch }}-${{ github.event.inputs.commit }}
  cancel-in-progress: true

jobs:
  build-lkm:
    uses: ./.github/workflows/build-lkm.yml
    with:
      build_all: ${{ github.event.inputs.build_all == 'true' }}
      commit: ${{ github.event.inputs.commit }}
      kmi_android12_5_10: ${{ github.event.inputs.kmi_android12_5_10 == 'true' }}
      kmi_android13_5_10: ${{ github.event.inputs.kmi_android13_5_10 == 'true' }}
      kmi_android13_5_15: ${{ github.event.inputs.kmi_android13_5_15 == 'true' }}
      kmi_android14_5_15: ${{ github.event.inputs.kmi_android14_5_15 == 'true' }}
      kmi_android14_6_1: ${{ github.event.inputs.kmi_android14_6_1 == 'true' }}
      kmi_android15_6_6: ${{ github.event.inputs.kmi_android15_6_6 == 'true' }}
      kmi_android16_6_12: ${{ github.event.inputs.kmi_android16_6_12 == 'true' }}

  prepare-module:
    runs-on: ubuntu-latest
    outputs:
      artifact-name: ${{ steps.pack.outputs.artifact-name }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.commit || github.event.inputs.branch }}
          fetch-depth: 0

      - name: Setup zig
        uses: jetsung/setup-zig@v0.0.4
        with:
          version: master

      - name: grab sstrip from ELFkickers
        run: |
          curl -fsSL https://distfiles.gentoo.org/distfiles/1e/ELFkickers-3.2.tar.gz | tar -xz
          make -C ELFkickers-3.2 sstrip
          cp ELFkickers-3.2/sstrip/sstrip .
          chmod +x ./sstrip

      - name: compile nm via zigcc
        run: |
          mkdir bin
          cd userspace/src
          zig cc -target aarch64-linux -Oz -mcmodel=tiny -static -nostdlib -ffreestanding -fno-unwind-tables \
            -fno-ident -Wno-invalid-noreturn -mllvm -enable-machine-outliner=always  -Wl,--entry=_start nm.c -o ../../bin/nm-arm64

          zig cc -target arm-linux -Oz -static -nostdlib -ffreestanding -fno-unwind-tables -fno-ident -Wno-invalid-noreturn \
            -ffunction-sections -fdata-sections -Wl,--gc-sections -Wl,--entry=_start nm.c -o ../../bin/nm-arm

          zig cc -target x86_64-linux -Oz -static -nostdlib -ffreestanding -fno-unwind-tables -fno-ident -Wno-invalid-noreturn \
            -Wl,--entry=_start nm.c -o ../../bin/nm-x86_64

          cd ../../bin
          wc -c nm-*
          ../sstrip -z nm-*
          wc -c nm-*
          file nm-*
          mkdir -p ../module/bin
          mv nm-* ../module/bin/

      - name: compile lkmloader via zigcc
        run: |
          git clone https://github.com/maxsteeel/lkmloader.git lkmloader_src
          cd lkmloader_src

          zig cc -target aarch64-linux -Oz -mcmodel=tiny -static -Wl,--gc-sections,-z,norelro -fno-unwind-tables \
            -fno-ident -flto -fmerge-all-constants -fomit-frame-pointer -mllvm -enable-machine-outliner=always \
              src/lkmloader.c -o lkmloader-arm64

          zig cc -target arm-linux -Oz -static -Wl,--gc-sections,-z,norelro -fno-unwind-tables \
            -fno-ident -flto -fmerge-all-constants -fomit-frame-pointer src/lkmloader.c -o lkmloader-arm

          zig cc -target x86_64-linux -Oz -static -Wl,--gc-sections,-z,norelro -fno-unwind-tables \
            -fno-ident -flto -fmerge-all-constants -fomit-frame-pointer src/lkmloader.c -o lkmloader-x86_64

          ../sstrip -z lkmloader-*
          wc -c lkmloader-*
          file lkmloader-*
          mv lkmloader-* ../module/bin/

      - name: Process versioning and metadata
        run: |
          SHORT_HASH=$(git rev-parse --short HEAD)
          COMMIT_COUNT=$(git rev-list --count HEAD)
          NAME=$(sed -n 's/^name=//p' module/module.prop | tr -d '\r ')
          BASE_VERSION=$(sed -n 's/^version=//p' module/module.prop | tr -d '\r ')

          sed -i "s/^versionCode=.*/versionCode=${COMMIT_COUNT}/" module/module.prop
          sed -i "s/^version=\(.*\)/version=\1 \(${COMMIT_COUNT}-${SHORT_HASH}-pinned\)/" module/module.prop
          echo "ARTIFACT_NAME=${NAME}-${BASE_VERSION}-pinned-${SHORT_HASH}-${COMMIT_COUNT}" >> $GITHUB_ENV

      - name: Optimize release module (via standalone esbuild)
        run: |
          MODULE_BUILD="$RUNNER_TEMP/nomount-module-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          WEBUI_BUILD="$RUNNER_TEMP/nomount-webui-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"

          cp -a module "$MODULE_BUILD"
          for f in "$MODULE_BUILD"/webroot/locales/*.json; do jq -c . "$f" > "$f.tmp" && mv "$f.tmp" "$f"; done
          mkdir -p "$WEBUI_BUILD"

          curl -fsSL "https://registry.npmjs.org/@esbuild/linux-x64/-/linux-x64-0.28.1.tgz" \
            | tar -xz -C /tmp --strip-components=2 package/bin/esbuild && chmod +x /tmp/esbuild
          /tmp/esbuild module/webroot/index.js --bundle --format=esm --minify --charset=utf-8 --outfile="$WEBUI_BUILD/index.js"
          /tmp/esbuild module/webroot/styles.css --minify --outfile="$WEBUI_BUILD/styles.css"
          tr '\n' ' ' < module/webroot/index.html | sed 's/  */ /g' | sed 's/> </></g' > "$WEBUI_BUILD/index.html"

          install -m 0644 "$WEBUI_BUILD/index.js" "$MODULE_BUILD/webroot/index.js"
          install -m 0644 "$WEBUI_BUILD/styles.css" "$MODULE_BUILD/webroot/styles.css"
          install -m 0644 "$WEBUI_BUILD/index.html" "$MODULE_BUILD/webroot/index.html"

      - name: Pack prepared module
        id: pack
        run: |
          MODULE_BUILD="$RUNNER_TEMP/nomount-module-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          tar -cf "$RUNNER_TEMP/module-base.tar" -C "$MODULE_BUILD" .
          echo "artifact-name=$ARTIFACT_NAME" >> "$GITHUB_OUTPUT"

      - name: Upload prepared module
        uses: actions/upload-artifact@v7
        with:
          name: module-base-pinned
          path: ${{ runner.temp }}/module-base.tar

  build-module:
    needs: [build-lkm, prepare-module]
    runs-on: ubuntu-latest

    steps:
      - name: Download prepared module
        uses: actions/download-artifact@v7
        with:
          name: module-base-pinned
          path: ${{ runner.temp }}

      - name: Unpack prepared module
        run: |
          MODULE_BUILD="$RUNNER_TEMP/nomount-module-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir -p "$MODULE_BUILD"
          tar -xf "$RUNNER_TEMP/module-base.tar" -C "$MODULE_BUILD"

      - name: Download all LKM artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: nomount-*
          path: ${{ runner.temp }}/nomount-module-${{ github.run_id }}-${{ github.run_attempt }}/lkm
          merge-multiple: true

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ needs.prepare-module.outputs.artifact-name }}
          path: ${{ runner.temp }}/nomount-module-${{ github.run_id }}-${{ github.run_attempt }}/
